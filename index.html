<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DWDM Dashboard</title>
<style>
:root{--bg:#F1F5F9;--card:#fff;--tx:#0B1F3A;--mu:#5B6B80;--ln:#DCE3EC;--navy:#0B1F3A;--teal:#0F8B96;--amb:#F2A33A;--red:#D64545;--grn:#2E9E6B;--blu:#2F6FD6;--soft:#E7EEF5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--card:#13233B;--tx:#E8EEF6;--mu:#9FB0C4;--ln:#25384F;--soft:#1B2E48;--navy:#0F8B96;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1424;--card:#13233B;--tx:#E8EEF6;--mu:#9FB0C4;--ln:#25384F;--soft:#1B2E48;--navy:#0F8B96;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Calibri,"Segoe UI",Arial,sans-serif}
#app{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 26px Arial,sans-serif;margin:0}h2{font:700 16px Arial,sans-serif;margin:0 0 10px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.sub{color:var(--mu);font-size:13px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--tx)}
button{border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--teal)}button.on{background:var(--teal);border-color:var(--teal);color:#fff}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:4px 8px;max-width:100%}
input[type=number]{width:74px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--ln)}
.tabs button{border:0;border-radius:10px 10px 0 0;background:none;padding:10px 16px;font-weight:700;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(11,31,58,.07)}
.kpi b{display:block;font:700 32px Arial,sans-serif;margin:2px 0}.kpi span{color:var(--mu);font-size:13px}
.bar{height:12px;border-radius:7px;background:var(--soft);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.done{background:var(--grn)}.prog{background:var(--blu)}.wait{background:var(--amb);color:#0B1F3A}.next{background:var(--mu)}
.warn{color:var(--red);font-weight:700}.ok{color:var(--grn);font-weight:700}
.lk{cursor:pointer;margin-bottom:10px}.lk .h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin-bottom:8px}
.tag{font-size:12px;background:var(--soft);border-radius:6px;padding:1px 8px;color:var(--mu)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:700}tr.low td{background:rgba(15,139,150,.12);font-weight:700}
.sc{overflow-x:auto}.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.task:last-child{border:0}
.task input[type=text]{flex:1;min-width:0}.vb{display:grid;grid-template-columns:120px 1fr 150px;gap:10px;align-items:center;margin:8px 0}
.vb .bar{height:18px}.sec{margin-top:16px}
@media(max-width:600px){.vb{grid-template-columns:90px 1fr}.vb>:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D0={upd:"12 November 2026",east:70,
links:[
{g:"Rising 8",seg:"CYBER ↔ EQUINIX",r:"400G",u:23,s:9,n:"1x400G Broken",c:[[2,"Lintas Arta"],[5,"Internal untuk IOH"],[2,"Internal"]]},
{g:"Rising 8",seg:"CYBER ↔ EQUINIX",r:"100G",u:20,s:6,c:[[3,"Mosaik"],[1,"THC (DATA Utama)"],[2,"Indosat"]]},
{g:"Rising 8",seg:"EQUINIX ↔ TBB",r:"400G",u:6,s:1},{g:"Rising 8",seg:"EQUINIX ↔ TBB",r:"100G",u:8,s:0},
{g:"Rising 8",seg:"TBB ↔ CYBER",r:"400G",u:14,s:1},{g:"Rising 8",seg:"TBB ↔ CYBER",r:"100G",u:8,s:0},
{g:"Surabaya–Denpasar",seg:"Surabaya Gubeng ↔ Denpasar",r:"400G",u:1,s:1},
{g:"Jayabaya",seg:"CYBER LT 5 ↔ Cirebon",r:"100G",u:4,s:0,c:[[4,"IJE"]]},
{g:"Jayabaya",seg:"CYBER LT 5 ↔ Waleri",r:"100G",u:4,s:3,c:[[3,"IJE"]]},
{g:"Jayabaya",seg:"CYBER LT 5 ↔ Omadata",r:"100G",u:12,s:8,c:[[2,"META"],[1,"Internal"],[1,"MVNET"],[4,"IJE"]]},
{g:"Visint",seg:"IDC ↔ CYB",r:"400G",u:8,s:1,n:"Cyber ↔ IDC sudah memakai 1x400G"}],
tasks:[
{g:"Jayabaya",t:"Ready For Service",s:"done"},{g:"Jayabaya",t:"DCN Omadata",s:"prog"},
{g:"East",t:"Integrasi FO Subsea By MTI",s:"prog"},{g:"East",t:"Integrasi NMS HUAWEI 12 November 2026",s:"prog"},
{g:"East",t:"Follow up Integrasi Splicing part by MTI",s:"next"},{g:"East",t:"Follow up terkait DCN untuk Monitoring Timika",s:"next"},
{g:"Visint",t:"Waiting for Converter LR1 to OTU4 1,2T (waiting payment from Finance)",s:"wait"},{g:"Visint",t:"Finalize Equinix ↔ GSW 1,2T",s:"prog"},
{g:"HTF",t:"Phase 1 — Ready, already in use",s:"done"},{g:"HTF",t:"Phase 2 — PO already released",s:"done"},{g:"HTF",t:"On start production — RFS W4 November 2026",s:"prog"},
{g:"Kalimantan",t:"Update timeline",s:"prog"},{g:"Kalimantan",t:"Survey Progress done",s:"done"},
{g:"Pengadaan",t:"New RFP and topology already released",s:"done"},{g:"Pengadaan",t:"RFP already sent to vendor",s:"done"},
{g:"Storage",t:"Request storage room di Tendean untuk tools dan spare material (FO, DWDM, IP)",s:"next"}],
v:{names:["Sintai","Fiber Home","Nokia","Visint","Huawei (MLPT)"],
p1:[18839600000,18377425156.8,20423776916.17,7230753600,21020368363],
p2:[5941100000,10984942550.4,10880080602.65,3538995600,8267631637],
st:[24780700000,29362367707.2,31303857518.82,10769749200,29288000000],
top:["100% T/T in advance before shipping the goods","15% DP, 85% after Material arrive in Jakarta","TOP Weave: 30 calendar days dr tgl invoice di terima. 100% payment in advance","50% DP, 50% before delivery","20% DP, 80% After BAST"],
spec:[["Max Lambda",["22 Ch","20 Ch","48 Ch","48","20 Ch"]],["EOL Capacity",["32T","64T","48x400G (19.2T)","40x400G","60x400G"]],["Delivery time",["6 weeks","9 weeks","8 weeks","6 weeks","6–8 weeks"]],["Power",["AC","AC/DC","AC","AC","AC"]],["WASON",["1+1 + Preset","1+1 + R","1+1 + R","1+1 + R","1+1 + R"]]]}};
const ST={done:"Selesai",prog:"Berjalan",wait:"Menunggu",next:"Tindak lanjut"};
let S=JSON.parse(JSON.stringify(D0)),edit=false,tab="ov",fg="Semua",fr="Semua",fs="all",open=-1,vs="harga",ref=null,stat="lokal",tmr;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idr=n=>"IDR "+Number(n).toLocaleString("id-ID",{maximumFractionDigits:2}),idle=l=>Math.max(l.u-l.s,0),pct=l=>l.u?l.s/l.u:0;
const tot=i=>S.v.p1[i]+S.v.p2[i],sum=c=>(c||[]).reduce((a,x)=>a+x[0],0);
const col=p=>p>=1?"var(--red)":p>=.7?"var(--amb)":"var(--teal)";
function warns(){const w=[];S.links.forEach(l=>{if(l.c&&sum(l.c)!==l.s)w.push(l.g+" · "+l.seg+" ("+l.r+"): used "+l.s+"x tetapi customer berjumlah "+sum(l.c)+"x");if(l.u&&!idle(l)&&l.s)w.push(l.g+" · "+l.seg+": kapasitas penuh (idle 0x"+l.r.replace("G","")+"G)");if(l.n&&/broken/i.test(l.n))w.push(l.g+" · "+l.seg+": "+l.n)});
S.v.names.forEach((n,i)=>{if(Math.abs(S.v.st[i]-tot(i))>1)w.push("Vendor "+n+": total di laporan "+idr(S.v.st[i])+" ≠ Phase 1 + Phase 2 "+idr(tot(i)))});return w}
const chips=(a,cur,list)=>list.map(x=>`<button class="${x===cur?"on":""}" data-a="${a}" data-v="${esc(x)}">${esc(x==="all"?"Semua":ST[x]||x)}</button>`).join("");
const inp=(p,v,t)=>`<input data-p="${p}" data-t="${t||"s"}" ${t==="n"?'type="number" min="0" step="any"':'type="text"'} value="${esc(v)}">`;
function head(){return `<div class="top"><div><h1>DWDM Dashboard</h1><div class="sub">Update: ${edit?inp("upd",S.upd):esc(S.upd)} · data tersimpan: <b>${stat}</b></div></div>
<div class="row"><button class="${edit?"on":""}" data-a="edit">${edit?"Selesai edit":"Edit data"}</button>${edit?'<button data-a="reset">Reset ke data awal</button>':""}</div></div>
<div class="tabs">${[["ov","Ringkasan"],["lk","Kapasitas Link"],["pj","Progres Proyek"],["vd","Vendor"]].map(t=>`<button class="${tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>`}
function ov(){const d=S.tasks.filter(t=>t.s==="done").length,i4=S.links.filter(l=>l.r==="400G").reduce((a,l)=>a+idle(l),0),lo=S.v.names.map((n,i)=>[n,tot(i)]).sort((a,b)=>a[1]-b[1])[0],w=warns(),att=S.tasks.filter(t=>t.s==="wait"||t.s==="next");
return `<div class="grid"><div class="card kpi"><span>Progres East</span><b>${S.east}%</b><div class="bar"><i style="width:${S.east}%;background:var(--teal)"></i></div></div>
<div class="card kpi"><span>Tugas selesai</span><b>${d}/${S.tasks.length}</b><div class="bar"><i style="width:${S.tasks.length?d/S.tasks.length*100:0}%;background:var(--grn)"></i></div></div>
<div class="card kpi"><span>Total idle 400G (semua link)</span><b>${i4}x400G</b></div>
<div class="card kpi"><span>Penawaran terendah</span><b>${esc(lo[0])}</b><span>${idr(lo[1])}</span></div></div>
<div class="grid sec"><div class="card"><h2>Perlu tindak lanjut (${att.length})</h2>${att.map(t=>`<div class="task"><span class="pill ${t.s}">${ST[t.s]}</span><span><b>${esc(t.g)}</b> · ${esc(t.t)}</span></div>`).join("")||"Tidak ada"}</div>
<div class="card"><h2>Pengecekan data (${w.length})</h2>${w.map(x=>`<div class="task"><span class="warn">!</span><span>${esc(x)}</span></div>`).join("")||'<span class="ok">Semua konsisten</span>'}</div></div>`}
function lk(){const gs=["Semua",...new Set(S.links.map(l=>l.g))];
const rows=S.links.map((l,i)=>[l,i]).filter(([l])=>(fg==="Semua"||l.g===fg)&&(fr==="Semua"||l.r===fr));
return `<div class="row">${chips("fg",fg,gs)}</div><div class="row" style="margin:8px 0 14px">${chips("fr",fr,["Semua","400G","100G"])}</div>`+
rows.map(([l,i])=>{const p=pct(l);return `<div class="card lk" data-a="open" data-v="${i}"><div class="h"><div><b>${esc(l.seg)}</b> <span class="tag">${esc(l.g)}</span> <span class="tag">${l.r}</span></div>
<div>${edit?`Ultimate ${inp("links."+i+".u",l.u,"n")} Used ${inp("links."+i+".s",l.s,"n")}`:`Used <b>${l.s}x${l.r}</b> / ${l.u}x${l.r} · idle <b>${idle(l)}x${l.r}</b>`}</div></div>
<div class="bar"><i style="width:${Math.min(p,1)*100}%;background:${col(p)}"></i></div><div class="sub" style="margin-top:6px">Utilisasi ${Math.round(p*100)}%${l.n&&!edit?" · "+esc(l.n):""}</div>
${edit?`<div class="sub">Catatan ${inp("links."+i+".n",l.n||"")}</div>`:""}
${edit?`<div class="sub" style="margin-top:10px">Customer · total ${sum(l.c)}x${l.r} dari used ${l.s}x${l.r}</div>${(l.c||[]).map((c,j)=>`<div class="task">${inp("links."+i+".c."+j+".0",c[0],"n")}x${l.r}${inp("links."+i+".c."+j+".1",c[1])}<button data-a="cdel" data-v="${i}.${j}">×</button></div>`).join("")}<button data-a="cadd" data-v="${i}">+ Customer</button>`:open===i&&l.c?`<div class="sc"><table style="margin-top:10px"><tr><th>Customer</th><th>Used</th></tr>${l.c.map(c=>`<tr><td>${esc(c[1])}</td><td>${c[0]}x${l.r}</td></tr>`).join("")}</table></div>`:""}</div>`}).join("")}
function pj(){const gs=[...new Set(S.tasks.map(t=>t.g))];
return `<div class="card kpi"><span>Progres East (PFI DWDM East)</span><b>${edit?inp("east",S.east,"n")+" %":S.east+"%"}</b><div class="bar"><i style="width:${S.east}%;background:var(--teal)"></i></div></div>
<div class="row" style="margin:14px 0">${chips("fs",fs,["all","done","prog","wait","next"])}</div><div class="grid">`+
gs.map(g=>{const ts=S.tasks.map((t,i)=>[t,i]).filter(([t])=>t.g===g&&(fs==="all"||t.s===fs));return ts.length?`<div class="card"><h2>${esc(g)}</h2>`+ts.map(([t,i])=>`<div class="task">${edit?`<select data-p="tasks.${i}.s" data-t="s">${Object.keys(ST).map(k=>`<option value="${k}" ${k===t.s?"selected":""}>${ST[k]}</option>`).join("")}</select>${inp("tasks."+i+".t",t.t)}<button data-a="del" data-v="${i}">×</button>`:`<span class="pill ${t.s}">${ST[t.s]}</span><span>${esc(t.t)}</span>`}</div>`).join("")+`</div>`:""}).join("")+`</div>`+
(edit?`<div class="card sec"><h2>Tambah tugas</h2><div class="row"><input id="ng" placeholder="Grup (mis. East)"><input id="nt" placeholder="Tugas" style="flex:1"><button data-a="add">Tambah</button></div></div>`:"")}
function vd(){const n=S.v.names,idx=n.map((_,i)=>i);if(vs==="harga")idx.sort((a,b)=>tot(a)-tot(b));const mx=Math.max(...n.map((_,i)=>tot(i))),lo=Math.min(...n.map((_,i)=>tot(i)));
const row=(lab,f)=>`<tr><th style="background:var(--soft);color:var(--tx)">${lab}</th>${idx.map(i=>`<td>${f(i)}</td>`).join("")}</tr>`;
return `<div class="row" style="margin-bottom:12px"><button class="${vs==="harga"?"on":""}" data-a="vs" data-v="harga">Urut harga</button><button class="${vs==="nama"?"on":""}" data-a="vs" data-v="nama">Urut laporan</button></div>
<div class="card"><h2>Total penawaran (Phase 1 + Phase 2)</h2>${idx.map(i=>`<div class="vb"><b>${esc(n[i])}</b><div class="bar"><i style="width:${tot(i)/mx*100}%;background:${tot(i)===lo?"var(--teal)":"var(--blu)"}"></i></div><span>${idr(tot(i))}${tot(i)===lo?" ✓ terendah":""}</span></div>`).join("")}</div>
<div class="card sec sc"><h2>Harga &amp; pembayaran</h2><table><tr><th></th>${idx.map(i=>`<th>${esc(n[i])}</th>`).join("")}</tr>
${row("Phase 1",i=>edit?inp("v.p1."+i,S.v.p1[i],"n"):idr(S.v.p1[i]))}${row("Phase 2",i=>edit?inp("v.p2."+i,S.v.p2[i],"n"):idr(S.v.p2[i]))}
${row("Total",i=>`<b>${idr(tot(i))}</b>${Math.abs(S.v.st[i]-tot(i))>1?`<div class="warn">Laporan: ${idr(S.v.st[i])}</div>`:""}`)}${row("Terms of Payment",i=>edit?inp("v.top."+i,S.v.top[i]):esc(S.v.top[i]))}</table></div>
<div class="card sec sc"><h2>Spesifikasi</h2><table><tr><th></th>${idx.map(i=>`<th>${esc(n[i])}</th>`).join("")}</tr>${S.v.spec.map((r,k)=>row(esc(r[0]),i=>edit?inp("v.spec."+k+".1."+i,r[1][i]):esc(r[1][i]))).join("")}</table></div>`}
function render(){$("#app").innerHTML=head()+({ov,lk,pj,vd}[tab])()}
function setP(p,v){const a=p.split(".");let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
function save(){stat="menyimpan…";clearTimeout(tmr);tmr=setTimeout(async()=>{if(!ref){stat="hanya di halaman ini";return render()}try{await ref.set({json:JSON.stringify(S)});stat="ya"}catch(e){stat="gagal (tidak ada izin menyimpan)"}render()},700)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||e.target.closest("input,select"))return;const a=b.dataset.a,v=b.dataset.v;
if(a==="tab")tab=v;else if(a==="fg")fg=v;else if(a==="fr")fr=v;else if(a==="fs")fs=v;else if(a==="vs")vs=v;else if(a==="open")open=open===+v?-1:+v;else if(a==="edit")edit=!edit;
else if(a==="reset"){if(confirm("Kembalikan semua data ke data awal laporan 12 November 2026?")){S=JSON.parse(JSON.stringify(D0));save()}}
else if(a==="del"){S.tasks.splice(+v,1);save()}else if(a==="cadd"){const l=S.links[+v];(l.c=l.c||[]).push([1,"Customer baru"]);save()}else if(a==="cdel"){const [i,j]=v.split(".").map(Number),l=S.links[i];l.c.splice(j,1);if(!l.c.length)delete l.c;save()}else if(a==="add"){const g=$("#ng").value.trim(),t=$("#nt").value.trim();if(g&&t){S.tasks.push({g,t,s:"next"});save()}}
render()});
document.addEventListener("change",e=>{const p=e.target.dataset.p;if(!p)return;setP(p,e.target.dataset.t==="n"?Math.max(0,parseFloat(e.target.value)||0):e.target.value);save();render()});
render();
(async()=>{try{if(!window.claude)return;const db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),10000))]);if(!db)return;ref=db.doc("report/main");stat="ya";
ref.onSnapshot(s=>{const d=s.exists&&s.data();if(d&&d.json){try{S=JSON.parse(d.json)}catch(e){}}if(!document.activeElement||document.activeElement.tagName==="BODY")render()},()=>{ref=null;stat="hanya di halaman ini";render()});render()}catch(e){}})();
</script>
</body>
</html>
